<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free tool to estimate up-front and monthly living costs for moving to Dubai. Includes rent cheques, deposits, broker fee, Ejari, DEWA, district cooling, and other Dubai-specific expenses." />
    <meta name="author" content="Alexander Kadyrov" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dubai Move-in Cost & Budget Planner" />
    <meta property="og:description" content="Calculate your Dubai move-in costs and monthly budget. Runs entirely in your browser." />
    <meta property="og:url" content="https://gruz0.github.io/dubai-budget-planner/" />
    <meta property="og:image" content="https://gruz0.github.io/dubai-budget-planner/showcase/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dubai Budget Planner showing up-front payments and a monthly budget" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://gruz0.github.io/dubai-budget-planner/showcase/og-image.png" />
    <meta name="twitter:image:alt" content="Dubai Budget Planner showing up-front payments and a monthly budget" />
    <link rel="canonical" href="https://gruz0.github.io/dubai-budget-planner/" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint; keep the key in sync with src/theme.ts
      try {
        const theme = localStorage.getItem('dubai-budget-planner:theme')
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
    <title>Dubai Move-in Cost & Monthly Budget Calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
